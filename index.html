<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermarket POS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
    <div class="brand"><div class="brand-mark">SM</div><div><strong>SUPER<span>MART</span></strong><small>Point of Sale</small></div></div>
    <div class="store-info">Store <b>#001</b> · Register <b>04</b></div>
    <div class="top-actions"><button id="holdBtn">⏸ Hold</button><button id="clearBtn">⌫ Clear</button><div class="cashier">● Kasun Perera</div></div>
  </header>

  <main class="layout">
    <section class="catalog">
      <div class="catalog-head">
        <div>
          <h1>Checkout</h1>
          <p>Scan products or search your catalog</p>
        </div>
        <div class="search"><span>⌕</span><input id="searchInput" placeholder="Search product or scan barcode..." autofocus><kbd>Ctrl K</kbd></div>
      </div>

      <div class="categories" id="categories"></div>
      <div class="products" id="products"></div>
    </section>
  </main>
</body>
</html>
